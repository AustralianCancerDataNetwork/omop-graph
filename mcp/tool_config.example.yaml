version: 1
server:
  name: omop-graph-mcp
  transport: stdio
  request_timeout_ms: 20000

tools:
  concept_view:
    enabled: true

  concept_lookup:
    enabled: true
    limits:
      max_candidates: 50

  shortest_paths:
    enabled: true
    limits:
      max_depth: 6
      max_paths: 10

  explore_connections:
    enabled: true
    limits:
      max_depth: 6
      max_edges_per_expand: 100
      max_total_expansions: 500
