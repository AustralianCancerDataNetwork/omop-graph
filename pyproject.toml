[project]
name = "omop-graph"
version = "1.0.1"
description = "Explainable, OMOP-native knowledge graph traversal and pathfinding"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Georgie Kennedy", email = "georgie.kennedy@unsw.edu.au" }
]
license = "Apache-2.0"

keywords = [
  "OMOP",
  "OHDSI",
  "clinical-data",
  "health-informatics",
  "sqlalchemy",
  "knowledge-graph",
  "LLM-grounding",
  "real-world-evidence",
  "rapidfuzz",
  "omop-llm",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "omop-alchemy>=0.6.0",
  "orm-loader>=0.3.15",
  "psycopg2-binary>=2.9.11",
  "sqlalchemy>=2.0.45",
  "typing-extensions>=4.15.0",
  "typer",
]

[project.optional-dependencies]
faiss = [
  "omop-emb[faiss]>=0.3.3",
]
pgvector = [
  "omop-emb[pgvector]>=0.3.3",
]
emb = [
  "omop-emb[all]>=0.3.3"
]

[dependency-groups]
dev = [
    "ipython>=9.8.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "rich>=14.2.0",
    "ruff>=0.14.10",
    "omop-emb[all]>=0.3.3",
    "mkdocs<2.0",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-mermaid2-plugin",
    "mkdocs-table-reader-plugin",
    "mkdocs-macros-plugin", 
]

[project.scripts]
omop-graph = "omop_graph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omop_graph"]

