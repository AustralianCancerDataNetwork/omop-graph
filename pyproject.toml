[project]
name = "omop-graph"
dynamic = ["version"]
description = "Explainable, OMOP-native knowledge graph traversal and pathfinding"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Georgie Kennedy", email = "georgie.kennedy@unsw.edu.au" },
  { name = "Nico Loesch", email = "n.loesch@unsw.edu.au" }
]
license = "Apache-2.0"

keywords = [
  "OMOP",
  "OHDSI",
  "clinical-data",
  "health-informatics",
  "sqlalchemy",
  "knowledge-graph",
  "LLM-grounding",
  "real-world-evidence",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "omop-alchemy==0.8.0",
  "typing-extensions>=4.15.0",
  "typer>=0.12",
  "rich>=13.0",
  "oaklib",
  "oa-configurator==0.1.2"
]

[project.optional-dependencies]
emb = [
  "omop-emb==1.1.1",
]
faiss-cpu = [
  "omop-emb[faiss-cpu]==1.1.1",
]
pgvector = [
  "omop-emb[pgvector]==1.1.1",
]
postgres = [
  "omop-alchemy[postgres]",
]


dev = [
    "ipython>=9.8.0",
    "ty>=0.0.59",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "rich>=14.2.0",
    "ruff>=0.14.10",
    "omop-graph[emb,faiss-cpu,pgvector,postgres]",
    "mkdocs<2.0",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-mermaid2-plugin",
    "mkdocs-table-reader-plugin",
    "mkdocs-macros-plugin",
    "oa-configurator[postgres]>=0.1.1",
]

[project.scripts]
omop-graph = "omop_graph.cli:app"

[project.entry-points."omop.config"]
omop_graph = "omop_graph.config:OmopGraphConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }

[tool.hatch.build.targets.wheel]
packages = ["src/omop_graph"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

